name: Docker Build, Push, and Deploy

on:
  push:
    branches:
      - week02

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cs6620-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/cs6620-app:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.revision=${{ github.sha }}
            build.source=github-actions
            build.workflow=${{ github.workflow }}
            build.run_id=${{ github.run_id }}
            build.run_number=${{ github.run_number }}

  deploy:
    name: Deploy to EC2 via SSM
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials (Learner Lab)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy latest image on EC2 (SSM Run Command)
        run: |
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/cs6620-app:latest"
          CONTAINER="cs6620-app"

          aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Auto-deploy latest Docker image via GitHub Actions + AWS SSM" \
            --parameters commands="[
              \"set -e\",
              \"echo ===== DEPLOY START =====\",
              \"echo Image: $IMAGE\",
              \"date\",
              \"docker pull $IMAGE\",
              \"docker stop $CONTAINER || true\",
              \"docker rm $CONTAINER || true\",
              \"docker run -d --name $CONTAINER -p 80:5000 --restart unless-stopped $IMAGE\",
              \"echo ===== RUNNING CONTAINERS =====\",
              \"docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'\"
            ]"

      - name: Verification note
        run: echo "SSM command submitted. Verify status in Systems Manager -> Run Command."